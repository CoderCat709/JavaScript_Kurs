<!DOCTYPE html>
<html lang="nb">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produkter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="img/logo.png" alt="HusebysalgLogo">
        </div>
        <h1>Husebysalg:Produkter</h1>
    </header>
    <nav class="hovedmeny" aria-label="Hovedmeny">
        <a href="index.html">Forside</a>
        <a href="produktside.html" aria-current="page">Produkter</a>
        <a href="info.html">Info</a>
        <a href="kontaktside.html">Kontakt</a>
        <a class="kurvlenke" href="handlekurv.html" aria-label="Åpne handlekurv">
            <img src="img/shopping-cart.png" alt="Handlekurv">
            <span id="antallKurv">0</span>
        </a>
        <article class="sokefelt">
        <input type="text" id="sokefelt" placeholder="Søk etter produkt">
        </article>
    </nav>
    <main>
        <h2 id="tittel">Produkter</h2>
        <p id="antallTreff"></p>
        <section class="varer" id="produktContainer" aria-labelledby="tittel"></section>
    </main>
    <footer>
        <p>Eid og vedlikeholdt av Henrik Huseby</p>
        <a href="kontaktside.html">Kontakt Info</a>
    </footer>
    <script src="produkter.js"></script>
    <script src="script.js"></script>
    <script>
        const container = document.getElementById("produktContainer");
        const sokefelt = document.getElementById("sokefelt");
        const antallTreff = document.getElementById("antallTreff");

        function visProdukter(liste) {
            antallTreff.textContent = liste.length + " produkter funnet";

            if (liste.length === 0) {
                container.innerHTML = "<p>Ingen produkter funnet</p>";
                return;
            }

            container.innerHTML = "";
            for (let produkt of liste) {
                container.innerHTML += `
                <a class="produktlenke" href="produkt.html?id=${produkt.id}">
                    <article class="vare" data-produkt-id="${produkt.id}">
                        <img class="bilde" src="${produkt.bilde}" alt="${produkt.navn}">
                        <h2>${produkt.navn}</h2>
                        <p class="type">${produkt.kategori}</p>
                        <p>${produkt.beskrivelse}</p>
                        <p class="pris">${produkt.minstepris} - ${produkt.hoyestepris} kr</p>
                        <button class="leggTilKnapp" data-id="${produkt.id}">Legg i handlekurv</button>
                    </article>
                </a>
                `;
            }
        }

        visProdukter(produkter);

        sokefelt.addEventListener("input", () => {
            let sok = sokefelt.value.toLowerCase();
            let resultat = produkter.filter(produkt =>
                produkt.navn.toLowerCase().includes(sok) ||
                produkt.beskrivelse.toLowerCase().includes(sok) ||
                produkt.kategori.toLowerCase().includes(sok)
            );
            visProdukter(resultat);
        });

 
        container.addEventListener("click", (event) => {
            if (event.target.classList.contains("leggTilKnapp")) {
                event.preventDefault(); 
                leggtil_kruv(event.target.dataset.id);
                event.target.textContent = "Lagt i handlekurven";
            }
        });
    </script>
</body>
</html>
